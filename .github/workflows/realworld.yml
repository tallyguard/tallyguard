name: Real-repo validation

# Network-dependent (clones real repos at pinned SHAs), so it runs on a schedule and on
# demand rather than on every push, to keep the per-commit CI fast and deterministic.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # weekly

permissions:
  contents: read

jobs:
  realworld:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to commit SHAs (supply-chain hardening, D047).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run realworld
